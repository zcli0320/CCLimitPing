[package]
name = "codex-helper-accounts"
version = "0.4.4"
edition = "2021"
publish = false

[dependencies]
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-std", "io-util"] }
toml = "0.8"
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
